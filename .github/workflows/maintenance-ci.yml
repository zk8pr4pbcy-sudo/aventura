name: Aventura Maintenance CI

on:
  pull_request:
  push:
    branches:
      - 'refactor/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find assets/js tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0)

      - name: Run Aventura smoke checks
        run: node tests/smoke.mjs

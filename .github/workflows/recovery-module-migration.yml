name: Recovery module migration

on:
  push:
    branches:
      - refactor/boutique-recovery-20260910

permissions:
  contents: write

jobs:
  migrate:
    if: github.ref_name == 'refactor/boutique-recovery-20260910'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run bounded recovery migration
        run: node scripts/migrate-recovery-modules.mjs

      - name: Validate migration
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/js/experience-copy-overrides.js
          node --check assets/js/boutique-last-light.js
          node --check assets/js/boutique-navigation.js
          if grep -R "launch-v2-recovery.js" --include='*.html' .; then
            echo "Legacy recovery reference remains"
            exit 1
          fi
          grep -F 'assets/js/boutique-last-light.js?v=20260910' collection.html
          grep -F 'assets/js/boutique-navigation.js?v=20260910' collection.html
          git diff --check

      - name: Commit migrated HTML if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- '*.html'; then
            echo "No HTML migration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          git commit -m "Replace launch recovery runtime with focused modules"
          git push origin HEAD:${GITHUB_REF_NAME}

name: Reveal runtime migration

on:
  push:
    branches:
      - 'refactor/reveal-runtime-20260910'

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: refactor/reveal-runtime-20260910

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply reveal runtime migration
        run: node scripts/migrate-reveal-runtime.mjs

      - name: Verify migrated JavaScript
        run: |
          node --check assets/js/app.js
          node --check assets/js/reveal-runtime.js
          node tests/reveal-runtime-contract.mjs
          node tests/smoke.mjs

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/app.js *.html
          git commit -m "Extract reveal runtime from app.js"
          git push origin HEAD:refactor/reveal-runtime-20260910

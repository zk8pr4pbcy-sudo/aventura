name: Apply contact mobile hotfix

on:
  push:
    branches:
      - fix-contact-mobile

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-contact-mobile
          fetch-depth: 0

      - name: Link mobile hotfix and validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('contact.html')
          text = p.read_text(encoding='utf-8')
          marker = '<link rel="stylesheet" href="assets/css/light-theme.css?v=recover-v2-20260809" />'
          hotfix = marker + '\n  <link rel="stylesheet" href="assets/css/contact-mobile-fix.css?v=20260809-1" />'
          if 'contact-mobile-fix.css' not in text:
              if marker not in text:
                  raise SystemExit('Expected light-theme marker not found in contact.html')
              text = text.replace(marker, hotfix, 1)
          p.write_text(text, encoding='utf-8')

          css = Path('assets/css/contact-mobile-fix.css').read_text(encoding='utf-8')
          required = [
              'grid-template-columns: minmax(0, 1fr) !important;',
              'overflow-x: hidden;',
              '.form-privacy-notice',
              '.form-actions',
              'site-footer .container'
          ]
          for item in required:
              assert item in css, f'Missing mobile safeguard: {item}'
          assert 'contact-mobile-fix.css?v=20260809-1' in text
          print('Contact mobile hotfix validation: OK')
          PY

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-contact-mobile.yml
          git add contact.html assets/css/contact-mobile-fix.css
          git commit -m 'Apply contact page mobile layout hotfix'
          git push origin HEAD:fix-contact-mobile

name: Apply prelaunch visual audit fixes

on:
  push:
    branches:
      - fix-visual-audit-findings-20260809
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix-visual-audit-findings-20260809
          fetch-depth: 0

      - name: Restore Last Light and center single fragrance cards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('assets/js/app.js')
          text = app.read_text(encoding='utf-8')

          roshan = '    "perfume-roshan": { type: "fragrance", categories: ["historic"], titleKey: "collection.p2Title", textKey: "collection.p2Text", statusKey: "common.comingSoon", prepKey: "collection.prepDevelopment", personalizationKey: "collection.personalizationAfterLaunch", image: "assets/images/perfumes/perfume-roshan.webp" },\n'
          desert_product = '    "perfume-desert": { type: "fragrance", categories: ["desert"], titleKey: "collection.p3Title", textKey: "collection.p3Text", statusKey: "common.comingSoon", prepKey: "collection.prepDevelopment", personalizationKey: "collection.personalizationAfterLaunch" },\n'
          if '"perfume-desert"' not in text:
              if roshan not in text:
                  raise SystemExit('Could not find Roshan catalog anchor')
              text = text.replace(roshan, roshan + desert_product, 1)

          old_desert = '''      desert: {
        request: "desert",
        theme: "desert",
        journey: "desert"
      },'''
          new_desert = '''      desert: {
        request: "desert",
        theme: "desert",
        journey: "desert",
        perfume: { id: "perfume-desert", titleKey: "collection.p3Title", textKey: "collection.p3Text" }
      },'''
          if old_desert in text:
              text = text.replace(old_desert, new_desert, 1)
          elif new_desert not in text:
              raise SystemExit('Could not find Desert experience config anchor')
          app.write_text(text, encoding='utf-8')

          css = Path('assets/css/styles.css')
          css_text = css.read_text(encoding='utf-8')
          marker = '/* Prelaunch visual audit: center a single fragrance teaser instead of leaving an empty grid column. */'
          if marker not in css_text:
              css_text += f'''\n\n{marker}\n.detail-product-grid--fragrance-only > .detail-perfume-product:only-child {{\n  grid-column: 1 / -1;\n  width: min(100%, 420px);\n  justify-self: center;\n}}\n'''
          css.write_text(css_text, encoding='utf-8')

          collection = Path('collection.html')
          c = collection.read_text(encoding='utf-8')
          c = c.replace('collection.html?experience=desert#boxes', 'collection.html?experience=desert#fragrances')

          taif_anchor = '          <article class="perfume-card perfume-card-with-actions" data-boutique-item data-product-id="perfume-taif" data-product-type="fragrance" data-category="taif" data-reveal>'
          desert_card = '''          <article class="perfume-card perfume-card-pending" data-boutique-item data-product-id="perfume-desert" data-product-type="fragrance" data-category="desert" data-reveal><div><span class="eyebrow">LAST LIGHT</span><strong data-i18n="collection.p3Title">Last Light</strong><p data-i18n="collection.p3Text">Dry woods, sun-warmed sand, vetiver and a mineral accord.</p><span class="status coming" data-i18n="common.comingSoon">Coming soon</span><small data-i18n="collection.lastLightPending">Original campaign artwork pending</small></div></article>\n'''
          if 'data-product-id="perfume-desert"' not in c:
              if taif_anchor not in c:
                  raise SystemExit('Could not find Taif fragrance anchor in collection')
              c = c.replace(taif_anchor, desert_card + taif_anchor, 1)
          collection.write_text(c, encoding='utf-8')

          affected = [
              'collection.html',
              'experience-desert.html',
              'experience-historic-jeddah.html',
              'experience-sea.html',
              'experience-taif.html',
          ]
          for filename in affected:
              p = Path(filename)
              h = p.read_text(encoding='utf-8')
              h = h.replace('assets/css/styles.css?v=launch-20260809', 'assets/css/styles.css?v=visual-audit-20260809')
              h = h.replace('assets/js/app.js?v=legal-20260809', 'assets/js/app.js?v=visual-audit-20260809')
              p.write_text(h, encoding='utf-8')
          PY

      - name: Validate visual audit fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path('assets/js/app.js').read_text(encoding='utf-8')
          css = Path('assets/css/styles.css').read_text(encoding='utf-8')
          collection = Path('collection.html').read_text(encoding='utf-8')
          desert = Path('experience-desert.html').read_text(encoding='utf-8')

          assert app.count('"perfume-desert"') >= 2, 'Last Light not wired into catalog and Desert experience'
          assert 'titleKey: "collection.p3Title"' in app
          assert 'image: "assets/images/perfumes/perfume-desert' not in app, 'Do not introduce an unapproved Desert perfume image'
          assert 'detail-perfume-product:only-child' in css
          assert 'data-product-id="perfume-desert"' in collection
          assert 'collection.html?experience=desert#fragrances' in collection
          assert 'collection.html?experience=desert#boxes' not in collection
          assert 'assets/js/app.js?v=visual-audit-20260809' in desert
          print('Last Light restored without generated artwork')
          print('Single fragrance teaser centering rule present')
          print('Affected page cache versions refreshed')
          PY

      - name: Commit generated fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/app.js assets/css/styles.css collection.html experience-desert.html experience-historic-jeddah.html experience-sea.html experience-taif.html
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Fix prelaunch visual audit findings'
          git push origin HEAD:fix-visual-audit-findings-20260809

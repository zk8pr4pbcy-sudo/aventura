name: Aventura Maintenance CI

on:
  pull_request:
  push:
    branches:
      - 'refactor/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find assets/js tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0)

      - name: Run Aventura smoke checks
        run: node tests/smoke.mjs

      - name: Run runtime state contract tests
        run: node tests/runtime-state.mjs

  browser:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install browser test dependency
        run: npm install --no-save playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local Aventura site
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/aventura-http.log 2>&1 &
          echo $! > /tmp/aventura-http.pid
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/contact.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/aventura-http.log
          exit 1

      - name: Run multilingual browser smoke checks
        env:
          AVENTURA_TEST_BASE_URL: http://127.0.0.1:4173
        run: node tests/browser-smoke.mjs

      - name: Stop local site
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/aventura-http.pid ]; then
            kill "$(cat /tmp/aventura-http.pid)" 2>/dev/null || true
          fi

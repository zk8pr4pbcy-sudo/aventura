name: Contact submission migration

on:
  push:
    branches:
      - refactor/contact-submission-contract-20260910

permissions:
  contents: write

jobs:
  migrate:
    if: github.ref_name == 'refactor/contact-submission-contract-20260910'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run bounded migration
        run: node scripts/migrate-contact-submission.mjs

      - name: Validate migrated JavaScript
        run: |
          node --check assets/js/app.js
          node --check assets/js/contact-submission.js
          node tests/contact-submission-contract.mjs
          git diff --check

      - name: Commit migration if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/js/app.js contact.html; then
            echo "No migration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/app.js contact.html
          git commit -m "Extract contact submission transport from app runtime"
          git push origin HEAD:${GITHUB_REF_NAME}

name: Fix perfume story dialog API

on:
  push:
    branches:
      - refactor/perfume-story-runtime-20260910
    paths:
      - scripts/fix-perfume-story-dialog-api.mjs
      - .github/workflows/fix-perfume-story-dialog-api.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/perfume-story-runtime-20260910

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Update dialog API reference
        run: node scripts/fix-perfume-story-dialog-api.mjs

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/app.js
          git commit -m "Use canonical dialog API for perfume stories"
          git push origin HEAD:refactor/perfume-story-runtime-20260910

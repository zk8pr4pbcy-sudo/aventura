name: Runtime language migration

on:
  push:
    branches:
      - refactor/runtime-language-20260910
    paths:
      - .github/workflows/runtime-language-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/runtime-language-20260910

      - name: Apply bounded runtime language integration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('assets/js/app.js')
          contact_path = Path('contact.html')
          ci_path = Path('.github/workflows/maintenance-ci.yml')
          integration_path = Path('tests/runtime-integration.mjs')

          app = app_path.read_text()
          contact = contact_path.read_text()
          ci = ci_path.read_text()

          declaration = '  var currentLanguage = DEFAULT_LANGUAGE;\n'
          if app.count(declaration) != 1:
              raise SystemExit('Unexpected currentLanguage declaration count')

          helpers = '''  var currentLanguage = DEFAULT_LANGUAGE;\n\n  function normalizeLanguage(language) {\n    var runtime = window.AVENTURA_RUNTIME;\n    if (runtime && runtime.language && typeof runtime.language.normalize === "function") {\n      return runtime.language.normalize(language);\n    }\n    return SUPPORTED_LANGUAGES.indexOf(language) === -1 ? DEFAULT_LANGUAGE : language;\n  }\n\n  function getActiveLanguage() {\n    var runtime = window.AVENTURA_RUNTIME;\n    if (runtime && runtime.language && typeof runtime.language.get === "function") {\n      return runtime.language.get();\n    }\n    return currentLanguage;\n  }\n'''
          app = app.replace(declaration, helpers, 1)

          old_apply = '''  function applyLanguage(language, updateUrl) {\n    if (SUPPORTED_LANGUAGES.indexOf(language) === -1) {\n      language = DEFAULT_LANGUAGE;\n    }\n\n    currentLanguage = language;\n'''
          new_apply = '''  function applyLanguage(language, updateUrl) {\n    language = normalizeLanguage(language);\n\n    currentLanguage = language;\n'''
          if app.count(old_apply) != 1:
              raise SystemExit('Unexpected applyLanguage guard shape')
          app = app.replace(old_apply, new_apply, 1)

          old_request = '        submissionData.set("request_language", currentLanguage);\n'
          new_request = '        submissionData.set("request_language", getActiveLanguage());\n'
          if app.count(old_request) != 1:
              raise SystemExit('Unexpected request_language assignment count')
          app = app.replace(old_request, new_request, 1)

          script_anchor = '  <script src="assets/js/analytics.js?v=date-validation-20260830" defer></script>\n  <script src="assets/js/app.js?v=date-validation-20260830" defer></script>\n'
          script_replacement = '  <script src="assets/js/analytics.js?v=date-validation-20260830" defer></script>\n  <script src="assets/js/runtime-state.js?v=20260910" defer></script>\n  <script src="assets/js/app.js?v=date-validation-20260830" defer></script>\n'
          if contact.count(script_anchor) != 1:
              raise SystemExit('Unexpected contact script anchor count')
          contact = contact.replace(script_anchor, script_replacement, 1)

          integration_test = '''import assert from "node:assert/strict";\nimport fs from "node:fs";\n\nconst app = fs.readFileSync("assets/js/app.js", "utf8");\nconst contact = fs.readFileSync("contact.html", "utf8");\n\nconst runtimeIndex = contact.indexOf("assets/js/runtime-state.js");\nconst appIndex = contact.indexOf("assets/js/app.js");\nassert.ok(runtimeIndex >= 0, "contact must load runtime-state.js");\nassert.ok(appIndex >= 0, "contact must load app.js");\nassert.ok(runtimeIndex < appIndex, "runtime-state.js must load before app.js");\n\nassert.match(app, /function normalizeLanguage\\(language\\)/, "app must expose a runtime-aware language normalizer");\nassert.match(app, /runtime\\.language\\.normalize\\(language\\)/, "app must use runtime language normalization when available");\nassert.match(app, /function getActiveLanguage\\(\\)/, "app must expose a runtime-aware language reader");\nassert.match(app, /submissionData\\.set\\("request_language", getActiveLanguage\\(\\)\\)/, "contact submission must use active runtime language");\n\nconsole.log("Runtime integration checks passed");\n'''
          integration_path.write_text(integration_test)

          ci_anchor = '      - name: Run runtime state contract tests\n        run: node tests/runtime-state.mjs\n'
          ci_replacement = '      - name: Run runtime state contract tests\n        run: node tests/runtime-state.mjs\n\n      - name: Run runtime integration checks\n        run: node tests/runtime-integration.mjs\n'
          if ci.count(ci_anchor) != 1:
              raise SystemExit('Unexpected maintenance CI runtime test anchor')
          ci = ci.replace(ci_anchor, ci_replacement, 1)

          app_path.write_text(app)
          contact_path.write_text(contact)
          ci_path.write_text(ci)
          PY

      - name: Verify migration
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/js/app.js
          node --check assets/js/runtime-state.js
          node --check tests/runtime-integration.mjs
          node tests/smoke.mjs
          node tests/runtime-state.mjs
          node tests/runtime-integration.mjs

      - name: Commit bounded migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/runtime-language-migration.yml
          git add assets/js/app.js contact.html .github/workflows/maintenance-ci.yml tests/runtime-integration.mjs
          git commit -m "Integrate runtime language state into contact flow"
          git push origin HEAD:refactor/runtime-language-20260910

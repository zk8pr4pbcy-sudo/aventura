name: Fragrance display hotfix

on:
  push:
    branches: [fragrance-display-hotfix-20260810]
    paths:
      - .github/workflows/fragrance-display-hotfix.yml

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fragrance-display-hotfix-20260810
      - name: Refresh fragrance assets on experience pages
        run: |
          set -euo pipefail
          pages=(
            experience-sea.html
            experience-historic-jeddah.html
            experience-desert.html
            experience-taif.html
            experience-jeddah-day.html
          )
          for page in "${pages[@]}"; do
            sed -i 's/fragrance-cards.css?v=20260810-1/fragrance-cards.css?v=20260810-2/g' "$page"
            sed -i 's/fragrance-cards.js?v=20260810-1/fragrance-cards.js?v=20260810-2/g' "$page"
          done
          rm -f .github/workflows/fragrance-display-hotfix.yml
      - name: Commit hotfix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experience-*.html .github/workflows/fragrance-display-hotfix.yml
          git commit -m "Refresh fragrance card assets on experience pages"
          git push origin HEAD:fragrance-display-hotfix-20260810

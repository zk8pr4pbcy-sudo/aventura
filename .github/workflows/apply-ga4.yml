name: Apply GA4 loader

on:
  push:
    branches: [ga4-launch-20260810]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ga4-launch-20260810
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Insert GA4 module into all root HTML pages
        run: |
          python - <<'PY'
          from pathlib import Path
          pages = sorted(Path('.').glob('*.html'))
          changed = 0
          marker = '<script src="assets/js/ga4.js?v=20260810" defer></script>'
          for p in pages:
              text = p.read_text(encoding='utf-8')
              if 'assets/js/ga4.js' in text:
                  continue
              analytics_variants = [
                  '<script src="assets/js/analytics.js?v=guide-label-20260810" defer></script>',
                  '<script src="assets/js/analytics.js?v=legal-20260809" defer></script>',
              ]
              inserted = False
              for needle in analytics_variants:
                  if needle in text:
                      text = text.replace(needle, marker + '\n  ' + needle, 1)
                      inserted = True
                      break
              if not inserted:
                  needle = '<script src="assets/js/app.js'
                  idx = text.find(needle)
                  if idx < 0:
                      raise SystemExit(f'No script insertion point in {p}')
                  text = text[:idx] + marker + '\n  ' + text[idx:]
              p.write_text(text, encoding='utf-8')
              changed += 1
          print(f'GA4 inserted into {changed} pages; total root pages={len(pages)}')
          missing = [str(p) for p in pages if 'assets/js/ga4.js?v=20260810' not in p.read_text(encoding='utf-8')]
          if missing:
              raise SystemExit('Missing GA4 loader: ' + ', '.join(missing))
          PY
          node --check assets/js/ga4.js
          count=$(grep -l 'assets/js/ga4.js?v=20260810' ./*.html | wc -l)
          test "$count" -eq 24
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/apply-ga4.yml
          git config user.name "aventura-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Load GA4 across all site pages"
            git push origin HEAD:ga4-launch-20260810
          fi

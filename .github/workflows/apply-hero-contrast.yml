name: Apply hero contrast stylesheet

on:
  push:
    branches:
      - fix-hero-contrast-20260809
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-hero-contrast-20260809
      - name: Add contrast stylesheet to all HTML pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          link = '  <link rel="stylesheet" href="assets/css/hero-contrast-fix.css?v=20260809-1" />\n'
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              if 'hero-contrast-fix.css' in text:
                  continue
              marker = '  <link rel="stylesheet" href="assets/css/light-theme.css?v=recover-v2-20260809" />\n'
              if marker in text:
                  text = text.replace(marker, marker + link, 1)
              else:
                  marker2 = '  <link rel="stylesheet" href="assets/css/styles.css?v=launch-20260809">\n'
                  if marker2 in text:
                      text = text.replace(marker2, marker2 + link, 1)
                  else:
                      raise SystemExit(f'No stylesheet marker found in {path}')
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit generated page links
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          if git diff --cached --quiet; then
            echo 'No page updates required.'
            exit 0
          fi
          git commit -m 'Load hero contrast fix across site'
          git push origin HEAD:fix-hero-contrast-20260809

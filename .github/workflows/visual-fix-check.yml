name: Visual fix check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Start site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Capture affected pages
        run: |
          cat > visual-fix-check.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async()=>{
            const files=['collection.html','experience-historic-jeddah.html','experience-sea.html','experience-desert.html','experience-taif.html'];
            const profiles=[['mobile',390,844],['desktop',1440,1100]];
            fs.mkdirSync('visual-fix-check',{recursive:true});
            const report=[];
            const browser=await chromium.launch({headless:true});
            for(const [name,w,h] of profiles){
              const context=await browser.newContext({viewport:{width:w,height:h},locale:'ar-SA',isMobile:name==='mobile'});
              const page=await context.newPage();
              for(const file of files){
                const errors=[];
                page.removeAllListeners('pageerror');
                page.on('pageerror',e=>errors.push(String(e)));
                await page.goto('http://127.0.0.1:4173/'+file,{waitUntil:'networkidle'});
                await page.waitForTimeout(250);
                const metrics=await page.evaluate(()=>({
                  overflow:Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-document.documentElement.clientWidth,
                  lastLight:document.querySelectorAll('[data-prelaunch-last-light],.prelaunch-last-light-section').length,
                  singleFragrance:[...document.querySelectorAll('.detail-product-grid--fragrance-only>.detail-perfume-product:only-child')].map(el=>({width:Math.round(el.getBoundingClientRect().width),left:Math.round(el.getBoundingClientRect().left),right:Math.round(el.getBoundingClientRect().right)})),
                  broken:[...document.images].filter(i=>i.complete&&i.naturalWidth===0).map(i=>i.src)
                }));
                await page.screenshot({path:`visual-fix-check/${name}__${file.replace('.html','')}.png`,fullPage:true,animations:'disabled'});
                report.push({name,file,errors,...metrics});
              }
              await context.close();
            }
            await browser.close();
            fs.writeFileSync('visual-fix-check/report.json',JSON.stringify(report,null,2));
            for(const row of report) console.log(JSON.stringify(row));
            if(report.some(r=>r.overflow>2||r.errors.length||r.broken.length)) process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node visual-fix-check.cjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aventura-visual-fix-check
          path: visual-fix-check
          retention-days: 3

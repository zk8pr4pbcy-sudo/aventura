name: Request channel smoke test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  request-channels:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.54.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/aventura-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/contact.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/aventura-http.log
          exit 1

      - name: Test real email request and WhatsApp handoff
        run: |
          cat > request-smoke-test.cjs <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: 390, height: 844 },
              locale: 'ar-SA'
            });
            const page = await context.newPage();
            const pageErrors = [];
            page.on('pageerror', error => pageErrors.push(String(error)));

            async function advanceWizard() {
              const next = page.locator('[data-request-next]:visible');
              if (await next.count()) {
                await next.first().click();
                await page.waitForTimeout(200);
              }
            }

            async function fillRequest(channel) {
              await page.goto('http://127.0.0.1:4173/contact.html?lang=ar', { waitUntil: 'networkidle' });

              // Step 1: a real supported path with an enforced licensed-guide choice.
              await page.selectOption('#type', 'historic-jeddah');
              await advanceWizard();

              // Step 2: satisfy the mandatory guide-language rule and mark this clearly as a test.
              const guideLanguage = page.locator('[name="guideLanguage"]:visible');
              if (await guideLanguage.count()) {
                const options = await guideLanguage.locator('option').evaluateAll(items => items.map(o => o.value).filter(Boolean));
                if (!options.length) throw new Error('Historic Jeddah guide language options are missing');
                await guideLanguage.selectOption(options[0]);
              } else {
                throw new Error('Historic Jeddah guide language field is missing');
              }
              if (await page.locator('#message:visible').count()) {
                await page.fill('#message:visible', 'اختبار تقني لقناة الطلب قبل الإطلاق — لا يلزم الرد على هذه الرسالة.');
              }
              await advanceWizard();

              // Step 3: contact details and delivery channel.
              await page.fill('#name:visible', 'اختبار أفنتورا قبل الإطلاق');
              await page.fill('#email:visible', 'contact@aventuraksa.com');
              await page.fill('#phone:visible', '+966555884854');
              if (await page.locator('#message:visible').count()) {
                await page.fill('#message:visible', 'اختبار تقني لقناة الطلب قبل الإطلاق — لا يلزم الرد على هذه الرسالة.');
              }
              await page.check(`input[name="submissionChannel"][value="${channel}"]`);
            }

            await fillRequest('email');
            const emailResponsePromise = page.waitForResponse(
              response => response.url().includes('formsubmit.co/ajax/contact@aventuraksa.com') && response.request().method() === 'POST',
              { timeout: 30000 }
            );
            await page.locator('[data-contact-form] button[type="submit"]:visible').click();
            const emailResponse = await emailResponsePromise;
            const emailBody = await emailResponse.text();
            await page.waitForTimeout(500);
            const emailStatus = await page.locator('[data-form-status]').textContent().catch(() => '');
            console.log('EMAIL_HTTP_STATUS=' + emailResponse.status());
            console.log('EMAIL_RESPONSE=' + emailBody.slice(0, 1200).replace(/\s+/g, ' '));
            console.log('EMAIL_UI_STATUS=' + String(emailStatus || '').trim());
            if (!emailResponse.ok()) {
              throw new Error('Email request failed with HTTP ' + emailResponse.status());
            }

            await fillRequest('whatsapp');
            await page.evaluate(() => {
              window.__aventuraWhatsAppTestUrl = '';
              window.open = function (url) {
                window.__aventuraWhatsAppTestUrl = String(url || '');
                return null;
              };
            });
            await page.locator('[data-contact-form] button[type="submit"]:visible').click();
            await page.waitForFunction(() => Boolean(window.__aventuraWhatsAppTestUrl), null, { timeout: 10000 });
            const whatsappUrl = await page.evaluate(() => window.__aventuraWhatsAppTestUrl);
            const parsed = new URL(whatsappUrl);
            const whatsappText = parsed.searchParams.get('text') || '';
            console.log('WHATSAPP_HOST=' + parsed.host);
            console.log('WHATSAPP_PATH=' + parsed.pathname);
            console.log('WHATSAPP_TEXT_LENGTH=' + whatsappText.length);
            console.log('WHATSAPP_TEXT_PREVIEW=' + whatsappText.slice(0, 500).replace(/\s+/g, ' '));
            if (parsed.host !== 'wa.me' || parsed.pathname !== '/966555884854' || whatsappText.length < 20) {
              throw new Error('WhatsApp handoff URL is invalid');
            }

            if (pageErrors.length) {
              console.log('PAGE_ERRORS=' + JSON.stringify(pageErrors));
              throw new Error('Runtime page errors occurred during request smoke test');
            }

            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
          node request-smoke-test.cjs

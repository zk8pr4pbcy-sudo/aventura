name: Contact validator migration

on:
  push:
    branches:
      - refactor/contact-wizard-20260910

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/contact-wizard-20260910
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Update site validator for extracted wizard
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/validate-site.mjs')
          source = path.read_text()
          old = '''const contactBlock = appSource.slice(appSource.indexOf("function setupContactForm()"));
const requestKeyBlock = contactBlock.slice(contactBlock.indexOf("var requestKeys = {"), contactBlock.indexOf("var requestedItem"));'''
          new = '''const contactBlock = appSource.slice(appSource.indexOf("function setupContactForm()"));
const contactWizardSource = fs.readFileSync(path.join(root, "assets/js/contact-wizard.js"), "utf8");
const requestKeyBlock = contactBlock.slice(contactBlock.indexOf("var requestKeys = {"), contactBlock.indexOf("var requestedItem"));'''
          if source.count(old) != 1:
              raise SystemExit(f'expected one contact validator setup block, found {source.count(old)}')
          source = source.replace(old, new)

          old_check = '''if (!/\\["name", "company", "phone", "email", "preferredResponse"\\]\\.forEach\\(function \\(name\\) \\{ moveField\\(name, thirdGrid\\); \\}\\);/.test(contactBlock) || !contactBlock.includes('["preferredResponse", "contact.preferredContactLabel"]')) {
  fail("contact", "preferred response field is not included in the final request step and request details");
}'''
          new_check = '''if (!/\\["name", "company", "phone", "email", "preferredResponse"\\]\\.forEach\\(function \\(name\\) \\{ moveField\\(name, thirdGrid\\); \\}\\);/.test(contactWizardSource) || !contactBlock.includes('["preferredResponse", "contact.preferredContactLabel"]')) {
  fail("contact", "preferred response field is not included in the final request step and request details");
}'''
          if source.count(old_check) != 1:
              raise SystemExit(f'expected one preferred-response validator, found {source.count(old_check)}')
          source = source.replace(old_check, new_check)
          path.write_text(source)
          PY
      - name: Verify site validation
        run: |
          node --check scripts/validate-site.mjs
          node scripts/validate-site.mjs
      - name: Commit validator update
        shell: bash
        run: |
          if git diff --quiet -- scripts/validate-site.mjs; then
            echo "No validator changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate-site.mjs
          git commit -m "Update site validator for contact wizard module"
          git push origin HEAD:refactor/contact-wizard-20260910

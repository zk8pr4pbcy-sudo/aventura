name: Temporary Scaled Production Load Test

on:
  push:
    branches:
      - ops/load-test-realistic-20260916

permissions:
  contents: read

jobs:
  scaled-load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run staged browser-like GET-only load test
        shell: bash
        run: |
          python - <<'PY'
          import concurrent.futures
          import statistics
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from html.parser import HTMLParser

          ORIGIN = "https://aventuraksa.com"
          TARGETS = [
              "/",
              "/?lang=en",
              "/?lang=es",
              "/events.html",
              "/jeddah-picks/",
              "/experience-historic-jeddah.html",
          ]
          STAGES = [
              ("200-vu", 200, 150),
              ("300-vu", 300, 200),
          ]
          MAX_ASSETS_PER_PAGE = 16
          REQUEST_TIMEOUT = 15
          MAX_FAILURE_RATE_PCT = 1.0
          MAX_DOC_P95_MS = 1500.0
          MAX_ASSET_P95_MS = 2500.0

          class AssetParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.assets = []
                  self.base_href = None

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "base" and attrs.get("href") and self.base_href is None:
                      self.base_href = attrs["href"]
                      return
                  candidate = None
                  if tag == "script" and attrs.get("src"):
                      candidate = attrs["src"]
                  elif tag == "img" and attrs.get("src"):
                      candidate = attrs["src"]
                  elif tag == "link" and attrs.get("href"):
                      rel = (attrs.get("rel") or "").lower()
                      if "stylesheet" in rel or "preload" in rel:
                          candidate = attrs["href"]
                  if candidate:
                      self.assets.append(candidate)

          def percentile(values, pct):
              if not values:
                  return 0.0
              values = sorted(values)
              idx = max(0, min(len(values) - 1, int(len(values) * pct) - 1))
              return values[idx]

          def fetch(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Aventura-Realistic-Safe-Load-Test/1.2",
                      "Accept": "text/html,application/xhtml+xml,application/javascript,text/css,image/avif,image/webp,image/*,*/*;q=0.8",
                      "Accept-Language": "ar-SA,ar;q=0.9,en;q=0.8,es;q=0.7",
                  },
              )
              t0 = time.perf_counter()
              status = 0
              body = b""
              error = ""
              try:
                  with urllib.request.urlopen(req, timeout=REQUEST_TIMEOUT) as response:
                      status = response.getcode()
                      body = response.read()
              except urllib.error.HTTPError as exc:
                  status = exc.code
                  error = f"HTTPError:{exc.code}"
              except Exception as exc:
                  error = f"{type(exc).__name__}:{exc}"
              elapsed_ms = (time.perf_counter() - t0) * 1000
              return url, status, elapsed_ms, len(body), error, body

          def resolve_asset(page_url, base_href, candidate):
              resolution_base = urllib.parse.urljoin(page_url, base_href) if base_href else page_url
              absolute = urllib.parse.urljoin(resolution_base, candidate)
              parsed = urllib.parse.urlparse(absolute)
              if parsed.scheme not in ("http", "https") or parsed.netloc != "aventuraksa.com":
                  return None
              return urllib.parse.urlunparse((parsed.scheme, parsed.netloc, parsed.path, "", parsed.query, ""))

          for stage_index, (name, users, asset_concurrency) in enumerate(STAGES):
              stage_started = time.perf_counter()

              doc_results = []
              with concurrent.futures.ThreadPoolExecutor(max_workers=users) as pool:
                  futures = []
                  for i in range(users):
                      target = TARGETS[i % len(TARGETS)]
                      url = urllib.parse.urljoin(ORIGIN, target)
                      futures.append((target, url, pool.submit(fetch, url)))
                  for target, url, future in futures:
                      row = future.result()
                      doc_results.append((target, url, row))

              doc_failures = []
              doc_latencies = []
              asset_tasks = []
              for target, page_url, row in doc_results:
                  _, status, latency_ms, _, error, body = row
                  doc_latencies.append(latency_ms)
                  if error or not (200 <= status < 400):
                      doc_failures.append(row)
                      continue
                  parser = AssetParser()
                  try:
                      parser.feed(body.decode("utf-8", errors="ignore"))
                  except Exception:
                      pass
                  seen = set()
                  for candidate in parser.assets:
                      asset = resolve_asset(page_url, parser.base_href, candidate)
                      if not asset or asset in seen:
                          continue
                      seen.add(asset)
                      asset_tasks.append(asset)
                      if len(seen) >= MAX_ASSETS_PER_PAGE:
                          break

              asset_results = []
              if asset_tasks:
                  with concurrent.futures.ThreadPoolExecutor(max_workers=asset_concurrency) as pool:
                      futures = [pool.submit(fetch, url) for url in asset_tasks]
                      for future in concurrent.futures.as_completed(futures):
                          asset_results.append(future.result())

              all_rows = [row for _, _, row in doc_results] + asset_results
              request_failures = [row for row in all_rows if row[4] or not (200 <= row[1] < 400)]
              asset_failures = [row for row in asset_results if row[4] or not (200 <= row[1] < 400)]
              asset_latencies = [row[2] for row in asset_results]
              status_counts = {}
              total_bytes = 0
              for _, status, _, size, _, _ in all_rows:
                  status_counts[status] = status_counts.get(status, 0) + 1
                  total_bytes += size

              wall_s = time.perf_counter() - stage_started
              failure_rate = (len(request_failures) / len(all_rows) * 100) if all_rows else 0.0
              doc_p95 = percentile(doc_latencies, 0.95)
              asset_p95 = percentile(asset_latencies, 0.95)
              total_rps = len(all_rows) / wall_s if wall_s else 0.0

              print(f"STAGE {name}")
              print(f"virtual_users={users} asset_concurrency_cap={asset_concurrency} wall_s={wall_s:.3f}")
              print(f"documents={len(doc_results)} doc_failures={len(doc_failures)} doc_latency_ms_avg={statistics.mean(doc_latencies):.1f} doc_p50={statistics.median(doc_latencies):.1f} doc_p95={doc_p95:.1f} doc_p99={percentile(doc_latencies, 0.99):.1f}")
              if asset_latencies:
                  print(f"assets={len(asset_results)} asset_failures={len(asset_failures)} asset_latency_ms_avg={statistics.mean(asset_latencies):.1f} asset_p50={statistics.median(asset_latencies):.1f} asset_p95={asset_p95:.1f} asset_p99={percentile(asset_latencies, 0.99):.1f}")
              print(f"http_requests={len(all_rows)} rps={total_rps:.2f} failure_rate_pct={failure_rate:.3f} status_counts={status_counts} transferred_bytes={total_bytes}")
              if request_failures:
                  print("sample_request_failures=")
                  for row in request_failures[:10]:
                      print(row[0], row[1], row[4])
              print("---")

              if failure_rate > MAX_FAILURE_RATE_PCT:
                  raise SystemExit(f"Safety stop: request failure rate {failure_rate:.3f}% exceeded {MAX_FAILURE_RATE_PCT:.3f}%")
              if doc_p95 > MAX_DOC_P95_MS:
                  raise SystemExit(f"Safety stop: document p95 {doc_p95:.1f}ms exceeded {MAX_DOC_P95_MS:.1f}ms")
              if asset_p95 > MAX_ASSET_P95_MS:
                  raise SystemExit(f"Safety stop: asset p95 {asset_p95:.1f}ms exceeded {MAX_ASSET_P95_MS:.1f}ms")

              if stage_index < len(STAGES) - 1:
                  time.sleep(5)
          PY

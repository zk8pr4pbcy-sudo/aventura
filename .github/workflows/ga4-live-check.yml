name: GA4 live verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-ga4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for Pages deployment
        run: |
          for i in {1..30}; do
            if curl -fsSL https://aventuraksa.com/assets/js/ga4.js | grep -q 'G-MC0GBSTCRT'; then
              echo 'GA4 module is live.'
              exit 0
            fi
            sleep 10
          done
          echo 'GA4 module did not appear on production in time.' >&2
          exit 1
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.54.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify live GA4 network request
        run: |
          cat > ga4-check.cjs <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
            const requests = [];
            page.on('request', req => {
              const u = req.url();
              if (u.includes('googletagmanager.com/gtag/js') || u.includes('google-analytics.com/g/collect')) requests.push(u);
            });
            await page.goto('https://aventuraksa.com/', { waitUntil: 'networkidle', timeout: 45000 });
            await page.waitForTimeout(4000);
            const state = await page.evaluate(() => ({
              hasGtag: typeof window.gtag === 'function',
              dataLayerLength: Array.isArray(window.dataLayer) ? window.dataLayer.length : 0
            }));
            console.log('GA4_STATE=' + JSON.stringify(state));
            console.log('GA4_REQUESTS=' + JSON.stringify(requests));
            if (!state.hasGtag || state.dataLayerLength < 2) throw new Error('GA4 dataLayer/gtag not initialized');
            if (!requests.some(u => u.includes('googletagmanager.com/gtag/js') && u.includes('G-MC0GBSTCRT'))) throw new Error('Google tag loader request missing Measurement ID');
            if (!requests.some(u => u.includes('google-analytics.com/g/collect') && /[?&]tid=G-MC0GBSTCRT(?:&|$)/.test(u))) throw new Error('GA4 collect request missing Measurement ID');
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
          node ga4-check.cjs

name: Temporary Repository Metrics

on:
  push:
    branches:
      - ops/load-test-realistic-20260916

permissions:
  contents: read

jobs:
  repo-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Count repository structure and code
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from collections import Counter, defaultdict

          root = Path('.')
          excluded_dirs = {'.git'}

          dirs = []
          files = []
          for p in root.rglob('*'):
              if any(part in excluded_dirs for part in p.parts):
                  continue
              if p.is_dir():
                  dirs.append(p)
              elif p.is_file():
                  files.append(p)

          def ext_of(p: Path):
              if p.name == 'site.webmanifest':
                  return '.webmanifest'
              return p.suffix.lower() or '[no-ext]'

          def line_count(path: Path):
              try:
                  data = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  return None
              if not data:
                  return 0
              return len(data.splitlines())

          def nonblank_count(path: Path):
              try:
                  data = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  return None
              return sum(1 for line in data.splitlines() if line.strip())

          ext_files = Counter(ext_of(p) for p in files)
          ext_lines = defaultdict(int)
          ext_nonblank = defaultdict(int)
          text_files = 0
          text_lines = 0

          for p in files:
              n = line_count(p)
              if n is None:
                  continue
              text_files += 1
              text_lines += n
              ext = ext_of(p)
              ext_lines[ext] += n
              ext_nonblank[ext] += nonblank_count(p) or 0

          core_exts = {'.html', '.css', '.js'}
          engineering_exts = core_exts | {'.mjs', '.yml', '.yaml'}
          data_exts = {'.json', '.xml', '.webmanifest'}

          def sum_files(exts):
              return sum(ext_files[e] for e in exts)
          def sum_lines(exts):
              return sum(ext_lines[e] for e in exts)
          def sum_nonblank(exts):
              return sum(ext_nonblank[e] for e in exts)

          print('METRICS_BEGIN')
          print(f'total_directories_excluding_root={len(dirs)}')
          print(f'total_files={len(files)}')
          print(f'text_files={text_files}')
          print(f'total_text_lines={text_lines}')
          for ext in ['.html','.css','.js','.mjs','.yml','.yaml','.json','.xml','.webmanifest','.md','.txt','.svg','.no-ext']:
              key = '[no-ext]' if ext == '.no-ext' else ext
              print(f'ext={key} files={ext_files[key]} lines={ext_lines[key]} nonblank={ext_nonblank[key]}')
          print(f'core_code_files_html_css_js={sum_files(core_exts)}')
          print(f'core_code_lines_html_css_js={sum_lines(core_exts)}')
          print(f'core_code_nonblank_html_css_js={sum_nonblank(core_exts)}')
          print(f'engineering_code_files_core_plus_mjs_yml={sum_files(engineering_exts)}')
          print(f'engineering_code_lines_core_plus_mjs_yml={sum_lines(engineering_exts)}')
          print(f'engineering_code_nonblank_core_plus_mjs_yml={sum_nonblank(engineering_exts)}')
          print(f'data_config_files={sum_files(data_exts)}')
          print(f'data_config_lines={sum_lines(data_exts)}')
          print('TOP_LEVEL_DIRECTORIES=' + ','.join(sorted(str(p) for p in dirs if len(p.parts)==1)))
          print('METRICS_END')
          PY

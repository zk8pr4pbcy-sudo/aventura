name: Conan GA4 read-only PR test

on:
  pull_request:
    paths:
      - 'scripts/conan-ga4-report.mjs'
      - '.github/workflows/conan-ga4-pr-test.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  ga4-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check report syntax
        run: node --check scripts/conan-ga4-report.mjs
      - name: Authenticate to GA4 using existing workload identity
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/722951777147/locations/global/workloadIdentityPools/aventura-conan-github/providers/github-actions
          service_account: aventura-conan-reader@aventura-analytics.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/analytics.readonly
      - name: Test GA4 queries without publishing alerts
        env:
          GA4_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          GA4_PROPERTY_ID: '549237338'
          GITHUB_TOKEN: ${{ github.token }}
          CONAN_DRY_RUN: 'true'
        run: node scripts/conan-ga4-report.mjs

name: Runtime date migration

on:
  push:
    branches:
      - refactor/runtime-dates-20260910

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/runtime-dates-20260910
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Patch Saudi date integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('assets/js/app.js')
          app = app_path.read_text()

          old_today = '''    function saudiDateToday() {
              var now = new Date();
              try {
                var dateParts = new Intl.DateTimeFormat("en-US", {
                  timeZone: "Asia/Riyadh",
                  year: "numeric",
                  month: "2-digit",
                  day: "2-digit"
                }).formatToParts(now);
                var values = {};
                dateParts.forEach(function (part) {
                  if (part.type !== "literal") {
                    values[part.type] = part.value;
                  }
                });
                return values.year + "-" + values.month + "-" + values.day;
              } catch (error) {
                return new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().split("T")[0];
              }
            }
          '''
          new_today = '''    function saudiDateToday() {
              var runtime = window.AVENTURA_RUNTIME;
              if (runtime && runtime.dates && typeof runtime.dates.today === "function") {
                return runtime.dates.today();
              }
              var now = new Date();
              try {
                var dateParts = new Intl.DateTimeFormat("en-US", {
                  timeZone: "Asia/Riyadh",
                  year: "numeric",
                  month: "2-digit",
                  day: "2-digit"
                }).formatToParts(now);
                var values = {};
                dateParts.forEach(function (part) {
                  if (part.type !== "literal") {
                    values[part.type] = part.value;
                  }
                });
                return values.year + "-" + values.month + "-" + values.day;
              } catch (error) {
                return new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().split("T")[0];
              }
            }
          '''

          old_min = '''    function setSaudiDateMinimum(field) {
              if (!isTimingField(field)) {
                return;
              }
              var minimumDate = saudiDateToday();
              field.setAttribute("min", field.type === "datetime-local" ? minimumDate + "T00:00" : minimumDate);
            }
          '''
          new_min = '''    function setSaudiDateMinimum(field) {
              if (!isTimingField(field)) {
                return;
              }
              var runtime = window.AVENTURA_RUNTIME;
              if (runtime && runtime.dates && typeof runtime.dates.minimumForInput === "function") {
                field.setAttribute("min", runtime.dates.minimumForInput(field.type));
                return;
              }
              var minimumDate = saudiDateToday();
              field.setAttribute("min", field.type === "datetime-local" ? minimumDate + "T00:00" : minimumDate);
            }
          '''

          old_past = '''    function isPastSaudiDate(field) {
              var value = timingDateValue(field);
              return Boolean(value && value < saudiDateToday());
            }
          '''
          new_past = '''    function isPastSaudiDate(field) {
              var value = timingDateValue(field);
              var runtime = window.AVENTURA_RUNTIME;
              if (runtime && runtime.dates && typeof runtime.dates.isPast === "function") {
                return runtime.dates.isPast(value, field && field.type);
              }
              return Boolean(value && value < saudiDateToday());
            }
          '''

          for label, old, new in [
              ('saudiDateToday', old_today, new_today),
              ('setSaudiDateMinimum', old_min, new_min),
              ('isPastSaudiDate', old_past, new_past),
          ]:
              count = app.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one legacy block, found {count}')
              app = app.replace(old, new)

          app_path.write_text(app)

          test_path = Path('tests/runtime-integration.mjs')
          test = test_path.read_text()
          marker = 'assert.match(app, /runtime\\.dates\\.today\\(\\)/'
          if marker not in test:
              insert = '''\nassert.match(app, /runtime\\.dates\\.today\\(\\)/, "contact must use runtime Saudi today when available");
          assert.match(app, /runtime\\.dates\\.minimumForInput\\(field\\.type\\)/, "contact date minimum must use runtime date contract");
          assert.match(app, /runtime\\.dates\\.isPast\\(value, field && field\\.type\\)/, "contact past-date validation must use runtime date contract");
          '''
              needle = 'console.log("Runtime integration checks passed");\n'
              if test.count(needle) != 1:
                  raise SystemExit('runtime integration completion marker not found exactly once')
              test = test.replace(needle, insert + '\n' + needle)
              test_path.write_text(test)
          PY
      - name: Verify migration
        run: |
          node --check assets/js/app.js
          node tests/smoke.mjs
          node tests/runtime-state.mjs
          node tests/runtime-integration.mjs
      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet -- assets/js/app.js tests/runtime-integration.mjs; then
            echo "No migration changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/app.js tests/runtime-integration.mjs
          git commit -m "Integrate Saudi date runtime into contact flow"
          git push origin HEAD:refactor/runtime-dates-20260910

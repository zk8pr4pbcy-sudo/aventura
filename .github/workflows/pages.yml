name: Deploy Aventura to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-hardened
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Wait for branch-based Pages deployment
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          run_id=""
          for attempt in {1..12}; do
            run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=20" \
              --jq '.workflow_runs[] | select(.name == "pages build and deployment" and .event == "dynamic") | .id' \
              | head -n 1)"
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 5
          done

          if [ -z "$run_id" ]; then
            echo "No branch-based Pages run found; continuing with hardened deployment."
            exit 0
          fi

          echo "Waiting for branch-based Pages run ${run_id} to finish before hardened deployment."
          for attempt in {1..120}; do
            status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')"
            conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion // ""')"
            echo "Branch Pages status: ${status}${conclusion:+ / ${conclusion}}"
            if [ "$status" = "completed" ]; then
              exit 0
            fi
            sleep 5
          done

          echo "Timed out waiting for branch-based Pages deployment."
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Do not publish the hardened artifact unless the same contracts used by
      # Site Quality and the critical mobile/browser paths are green.
      - name: Pre-deployment syntax and contract checks
        run: |
          set -euo pipefail
          node --check assets/js/app.js
          node --check assets/js/curated-calendar.js
          node --check assets/js/contact-submission.js
          node --check assets/js/translations.js
          node tests/seo-contract.mjs
          node tests/curated-calendar-contract.mjs
          node tests/ga4-journey-contract.mjs
          node tests/contact-submission-contract.mjs
          node scripts/validate-site.mjs
          node tests/full-review-contract.mjs

      - name: Build hardened public artifact
        run: node scripts/build-public.mjs

      - name: Install browser smoke test tools
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start hardened local site for browser checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory _site > /tmp/aventura-qa-http.log 2>&1 &
          echo $! > /tmp/aventura-qa-http.pid
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/contact.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/aventura-qa-http.log
          exit 1

      - name: Validate multilingual navigation, bookings, SEO and event cards
        env:
          AVENTURA_TEST_BASE_URL: http://127.0.0.1:4173
        run: |
          set -euo pipefail
          node tests/browser-smoke.mjs
          node tests/contact-submission-browser.mjs
          node tests/seo-browser.mjs
          node tests/curated-calendar-browser.mjs
          node tests/full-review-browser.mjs

      - name: Stop browser test site
        if: always()
        run: |
          if [ -f /tmp/aventura-qa-http.pid ]; then
            kill "$(cat /tmp/aventura-qa-http.pid)" 2>/dev/null || true
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

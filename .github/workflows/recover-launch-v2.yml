name: Recover Aventura launch V2

on:
  push:
    branches:
      - recover-launch-v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: recover-launch-v2
          fetch-depth: 0

      - name: Restore launch copy and cache versions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('assets/js/translations.js')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'Arabic coffee, dates and Beit Nassif entry': 'Arabic coffee, dates and selected heritage stops',
              'All walking formats include Arabic coffee, dates and entry to Beit Nassif. Other entry fees are not included.': 'All walking formats include Arabic coffee, dates and a licensed guide. Any additional paid entries are confirmed separately.',
              'A licensed guided walk with Arabic coffee, dates and Beit Nassif entry.': 'A licensed guided walk with Arabic coffee, dates and selected heritage stops.',
              'القهوة العربية والتمر ودخول بيت نصيف': 'القهوة العربية والتمر ومحطات تراثية مختارة',
              'تشمل جميع الجولات القهوة العربية والتمر ودخول بيت نصيف، ولا تشمل أي رسوم دخول أخرى.': 'تشمل جميع جولات المشي القهوة العربية والتمر ومرشدًا سياحيًا مرخصًا، وتُؤكد أي رسوم دخول إضافية بشكل منفصل.',
              'جولة مع مرشد مرخص تشمل القهوة العربية والتمر ودخول بيت نصيف.': 'جولة مع مرشد سياحي مرخص تشمل القهوة العربية والتمر ومحطات تراثية مختارة.',
              'Café árabe, dátiles y entrada a la Casa Nassif': 'Café árabe, dátiles y paradas patrimoniales seleccionadas',
              'Todos incluyen café árabe, dátiles y Casa Nassif. No incluyen otras entradas.': 'Todos los recorridos a pie incluyen café árabe, dátiles y un guía autorizado. Las entradas adicionales de pago se confirman por separado.',
              'Paseo con guía autorizado, café árabe, dátiles y entrada a Casa Nassif.': 'Paseo con guía autorizado, café árabe, dátiles y paradas patrimoniales seleccionadas.'
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')

          for html in Path('.').glob('*.html'):
              value = html.read_text(encoding='utf-8')
              value = value.replace('light-theme.css?v=header-system-20260809', 'light-theme.css?v=recover-v2-20260809')
              value = value.replace('light-theme.css?v=experience-readability-20260803', 'light-theme.css?v=recover-v2-20260809')
              html.write_text(value, encoding='utf-8')
          PY

      - name: Self-host Alexandria variable font
        shell: bash
        run: |
          mkdir -p assets/fonts
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/alexandria/Alexandria%5Bwght%5D.ttf' \
            --output assets/fonts/alexandria-variable.ttf
          python - <<'PY'
          from pathlib import Path
          path = Path('assets/css/light-theme.css')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'https://raw.githubusercontent.com/google/fonts/main/ofl/alexandria/Alexandria%5Bwght%5D.ttf',
              '../fonts/alexandria-variable.ttf'
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate launch recovery
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urlsplit
          import re

          root = Path('.')
          html_files = sorted(root.glob('*.html'))
          assert len(html_files) == 24, f'Expected 24 HTML pages, found {len(html_files)}'

          banned = ['بيت نصيف', 'Beit Nassif', 'Casa Nassif', 'Nassif']
          text_files = [p for p in root.rglob('*') if p.is_file() and p.suffix.lower() in {'.html','.js','.json','.md','.txt','.css'}]
          hits = []
          for p in text_files:
              text = p.read_text(encoding='utf-8', errors='ignore')
              for term in banned:
                  if term.casefold() in text.casefold():
                      hits.append(f'{p}: {term}')
          assert not hits, 'Banned historic reference remains: ' + ', '.join(hits)

          missing = []
          href_re = re.compile(r'href=["\']([^"\']+)["\']', re.I)
          for page in html_files:
              text = page.read_text(encoding='utf-8')
              for href in href_re.findall(text):
                  if href.startswith(('#','http://','https://','mailto:','tel:','javascript:')):
                      continue
                  target = urlsplit(href).path
                  if not target:
                      continue
                  candidate = root / target
                  if not candidate.exists():
                      missing.append(f'{page.name} -> {href}')
          assert not missing, 'Broken local links: ' + ', '.join(missing)

          partner = Path('partners.html').read_text(encoding='utf-8')
          assert 'data-partner-form method="post"' in partner
          assert 'data-partner-form novalidate' not in partner
          assert 'type="email"' in partner

          historic = Path('experience-historic-jeddah.html').read_text(encoding='utf-8')
          for request in ['historic-walk','historic-group','historic-transport','historic-vip']:
              assert f'request={request}' in historic, f'Missing Historic Jeddah request option: {request}'

          sea_expectations = {
              'experience-golden-hour.html': 'request=golden-hour',
              'experience-bayadah.html': 'request=bayadah-day',
              'experience-grand-bayadah.html': 'request=bayadah-grand',
          }
          for filename, expected in sea_expectations.items():
              assert expected in Path(filename).read_text(encoding='utf-8'), f'Incorrect sea request link in {filename}'

          css = Path('assets/css/light-theme.css').read_text(encoding='utf-8')
          assert 'Alexandria' in css
          assert '../fonts/alexandria-variable.ttf' in css
          assert Path('assets/fonts/alexandria-variable.ttf').stat().st_size > 10000

          assert Path('assets/js/launch-v2-recovery.js').exists()
          collection = Path('collection.html').read_text(encoding='utf-8')
          assert 'launch-v2-recovery.js' in collection

          print(f'HTML pages: {len(html_files)}')
          print('Local links: OK')
          print('Historic reference: 0 occurrences')
          print('Sea request links: OK')
          print('Partner form safety: OK')
          print('Alexandria local font: OK')
          PY

      - name: Validate translation dictionaries
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const code = fs.readFileSync('assets/js/translations.js', 'utf8');
          const sandbox = { window: {} };
          vm.runInNewContext(code, sandbox);
          const dict = sandbox.window.AVENTURA_I18N;
          if (!dict || !dict.en || !dict.ar || !dict.es) throw new Error('Missing translation dictionary');
          const counts = Object.fromEntries(['en','ar','es'].map(lang => [lang, Object.keys(dict[lang]).length]));
          if (!(counts.en === counts.ar && counts.ar === counts.es)) {
            throw new Error('Translation key counts differ: ' + JSON.stringify(counts));
          }
          if (counts.en !== 1260) {
            throw new Error('Expected 1260 translation keys per language, found ' + JSON.stringify(counts));
          }
          console.log('Translation keys:', counts);
          NODE

      - name: Commit recovered launch files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/translations.js assets/css/light-theme.css assets/fonts/alexandria-variable.ttf '*.html'
          if git diff --cached --quiet; then
            echo 'No generated recovery changes to commit.'
            exit 0
          fi
          git commit -m 'Finalize launch-ready Aventura recovery'
          git push origin HEAD:recover-launch-v2

name: Aventura Contact Refactor Bootstrap

on:
  push:
    branches:
      - refactor/maintenance-20260909
    paths:
      - '.github/workflows/refactor-bootstrap.yml'

permissions:
  contents: write

jobs:
  migrate-contact-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/maintenance-20260909

      - name: Migrate contact page to static structure
        shell: python
        run: |
          from pathlib import Path

          path = Path('contact.html')
          source = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}. Refusing to modify contact.html.')
              source = source.replace(old, new, 1)

          replace_once(
              '  <link rel="stylesheet" href="assets/css/contact-mobile-fix.css?v=20260810-2" />',
              '  <link rel="stylesheet" href="assets/css/contact-mobile-fix.css?v=20260810-2" />\n  <link rel="stylesheet" href="assets/css/contact.css?v=20260909" />',
              'contact stylesheet'
          )

          replace_once(
              '  <script src="assets/js/contact-flow-fix.js?v=20260823-1" defer></script>',
              '  <script src="assets/js/contact-consent.js?v=20260909" defer></script>',
              'contact consent script'
          )

          replace_once(
              '          <input type="hidden" name="request_summary" value="">',
              '          <input type="hidden" name="request_summary" value="">\n          <input type="hidden" name="privacy_consent_at" value="">',
              'consent timestamp field'
          )

          fieldset_marker = '            <fieldset class="request-options full" data-submission-channel>'
          if source.count(fieldset_marker) != 1:
              raise SystemExit('Expected exactly one submission-channel fieldset.')
          fieldset_start = source.index(fieldset_marker)
          fieldset_close_marker = '            </fieldset>'
          fieldset_close = source.index(fieldset_close_marker, fieldset_start)

          consent_lines = [
              '              <label class="aventura-request-consent full" data-request-consent',
              '                data-consent-error-ar="يجب الموافقة على معالجة البيانات وفق سياسة الخصوصية قبل إرسال الطلب."',
              '                data-consent-error-en="Please agree to the data processing terms in the Privacy Policy before sending your request."',
              '                data-consent-error-es="Debes aceptar el tratamiento de datos conforme a la Política de privacidad antes de enviar la solicitud.">',
              '                <input type="checkbox" name="privacy_consent" value="yes" required aria-required="true">',
              '                <span class="aventura-request-consent-copy">',
              '                  <span data-consent-lang="ar" lang="ar">أوافق على معالجة بياناتي لغرض مراجعة طلبي والتواصل معي وفق <a href="privacy.html">سياسة الخصوصية</a>.</span>',
              '                  <span data-consent-lang="en" lang="en">I agree that Aventura may process my data to review my request and contact me under the <a href="privacy.html">Privacy Policy</a>.</span>',
              '                  <span data-consent-lang="es" lang="es">Acepto que Aventura trate mis datos para revisar mi solicitud y ponerse en contacto conmigo conforme a la <a href="privacy.html">Política de privacidad</a>.</span>',
              '                </span>',
              '              </label>',
          ]
          consent = '\n'.join(consent_lines) + '\n'
          source = source[:fieldset_close] + consent + source[fieldset_close:]

          aside_start_marker = '        <aside class="contact-panel" data-reveal>'
          aside_end_marker = '        </aside>\n'
          if source.count(aside_start_marker) != 1:
              raise SystemExit('Expected exactly one contact panel before reordering.')
          aside_start = source.index(aside_start_marker)
          aside_end = source.index(aside_end_marker, aside_start) + len(aside_end_marker)
          aside = source[aside_start:aside_end]
          source = source[:aside_start] + source[aside_end:]

          form_end_marker = '        </form>\n'
          if source.count(form_end_marker) != 1:
              raise SystemExit('Expected exactly one contact form before reordering.')
          form_end = source.index(form_end_marker) + len(form_end_marker)
          source = source[:form_end] + '\n' + aside + source[form_end:]

          checks = {
              'contact form precedes contact panel': source.index('<form class="form-card"') < source.index(aside_start_marker),
              'legacy runtime patch reference removed': 'contact-flow-fix.js' not in source,
              'new contact stylesheet referenced': 'assets/css/contact.css?v=20260909' in source,
              'new consent module referenced': 'assets/js/contact-consent.js?v=20260909' in source,
              'one privacy consent checkbox exists': source.count('name="privacy_consent"') == 1,
              'one consent timestamp exists': source.count('name="privacy_consent_at"') == 1,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Migration validation failed: ' + ', '.join(failed))

          path.write_text(source, encoding='utf-8')

      - name: Remove legacy runtime patch and commit migration
        shell: bash
        run: |
          set -euo pipefail
          git rm assets/js/contact-flow-fix.js
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contact.html
          git commit -m "refactor: replace contact runtime patch with static structure"
          git push origin HEAD:refactor/maintenance-20260909

name: Site quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/translations.js
          node --check assets/js/analytics.js
          node --check assets/js/ga4.js
          node --check assets/js/seo-runtime.js
          node --check assets/js/app.js
          node --check assets/js/curated-calendar.js
          node --check assets/js/legal-content.js
          node --check scripts/localize-default-metadata.mjs
          node --check scripts/build-public.mjs
      - name: Build hardened public artifact
        run: node scripts/build-public.mjs
      - name: Check hardened artifact JavaScript syntax
        run: |
          node --check _site/assets/js/translations.js
          node --check _site/assets/js/app.js
          node --check _site/assets/js/contact-submission.js
          node --check _site/assets/js/event-request.js
          node --check _site/assets/js/jeddah-picks-request.js
          node --check _site/assets/js/legal-content.js
      - name: Validate SEO contract
        run: node tests/seo-contract.mjs
      - name: Validate Curated Calendar contract
        run: node tests/curated-calendar-contract.mjs
      - name: Validate pages, links and translations
        run: node scripts/validate-site.mjs

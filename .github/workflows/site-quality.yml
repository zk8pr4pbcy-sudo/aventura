name: Site quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  apply-visual-audit-fix:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix-visual-audit-findings-20260809'
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix-visual-audit-findings-20260809
          fetch-depth: 0
      - name: Apply audited fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('assets/js/app.js')
          text = app.read_text(encoding='utf-8')
          roshan = '    "perfume-roshan": { type: "fragrance", categories: ["historic"], titleKey: "collection.p2Title", textKey: "collection.p2Text", statusKey: "common.comingSoon", prepKey: "collection.prepDevelopment", personalizationKey: "collection.personalizationAfterLaunch", image: "assets/images/perfumes/perfume-roshan.webp" },\n'
          desert_product = '    "perfume-desert": { type: "fragrance", categories: ["desert"], titleKey: "collection.p3Title", textKey: "collection.p3Text", statusKey: "common.comingSoon", prepKey: "collection.prepDevelopment", personalizationKey: "collection.personalizationAfterLaunch" },\n'
          if '"perfume-desert"' not in text:
              assert roshan in text
              text = text.replace(roshan, roshan + desert_product, 1)

          old_desert = '''      desert: {
        request: "desert",
        theme: "desert",
        journey: "desert"
      },'''
          new_desert = '''      desert: {
        request: "desert",
        theme: "desert",
        journey: "desert",
        perfume: { id: "perfume-desert", titleKey: "collection.p3Title", textKey: "collection.p3Text" }
      },'''
          if old_desert in text:
              text = text.replace(old_desert, new_desert, 1)
          else:
              assert new_desert in text
          app.write_text(text, encoding='utf-8')

          css = Path('assets/css/styles.css')
          cs = css.read_text(encoding='utf-8')
          marker = '/* Prelaunch visual audit: center a single fragrance teaser instead of leaving an empty grid column. */'
          if marker not in cs:
              cs += '\n\n' + marker + '\n.detail-product-grid--fragrance-only > .detail-perfume-product:only-child {\n  grid-column: 1 / -1;\n  width: min(100%, 420px);\n  justify-self: center;\n}\n'
          css.write_text(cs, encoding='utf-8')

          collection = Path('collection.html')
          c = collection.read_text(encoding='utf-8')
          c = c.replace('collection.html?experience=desert#boxes', 'collection.html?experience=desert#fragrances')
          anchor = '          <article class="perfume-card perfume-card-with-actions" data-boutique-item data-product-id="perfume-taif" data-product-type="fragrance" data-category="taif" data-reveal>'
          card = '          <article class="perfume-card perfume-card-pending" data-boutique-item data-product-id="perfume-desert" data-product-type="fragrance" data-category="desert" data-reveal><div><span class="eyebrow">LAST LIGHT</span><strong data-i18n="collection.p3Title">Last Light</strong><p data-i18n="collection.p3Text">Dry woods, sun-warmed sand, vetiver and a mineral accord.</p><span class="status coming" data-i18n="common.comingSoon">Coming soon</span><small data-i18n="collection.lastLightPending">Original campaign artwork pending</small></div></article>\n'
          if 'data-product-id="perfume-desert"' not in c:
              assert anchor in c
              c = c.replace(anchor, card + anchor, 1)
          collection.write_text(c, encoding='utf-8')

          for filename in ['collection.html','experience-desert.html','experience-historic-jeddah.html','experience-sea.html','experience-taif.html']:
              p=Path(filename)
              h=p.read_text(encoding='utf-8')
              h=h.replace('assets/css/styles.css?v=launch-20260809','assets/css/styles.css?v=visual-audit-20260809')
              h=h.replace('assets/js/app.js?v=legal-20260809','assets/js/app.js?v=visual-audit-20260809')
              p.write_text(h, encoding='utf-8')
          PY
      - name: Commit audited fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/app.js assets/css/styles.css collection.html experience-desert.html experience-historic-jeddah.html experience-sea.html experience-taif.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix prelaunch visual audit findings'
          git push origin HEAD:fix-visual-audit-findings-20260809

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/translations.js
          node --check assets/js/analytics.js
          node --check assets/js/app.js
          node --check assets/js/legal-content.js
          node --check scripts/localize-default-metadata.mjs
      - name: Validate pages, links and translations
        run: node scripts/validate-site.mjs

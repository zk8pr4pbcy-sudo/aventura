name: Aventura Backend Container CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-container-ci.yml'
  push:
    branches:
      - 'feature/backend-**'
    paths:
      - 'backend/**'
      - '.github/workflows/backend-container-ci.yml'

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: aventura
          POSTGRES_PASSWORD: aventura_test
          POSTGRES_DB: aventura_container_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aventura -d aventura_container_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://aventura:aventura_test@127.0.0.1:5432/aventura_container_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Apply migrations before deployment
        working-directory: backend
        run: npm run db:migrate

      - name: Run production preflight outside container
        working-directory: backend
        env:
          NODE_ENV: production
          PUBLIC_REQUESTS_ENABLED: 'false'
        run: npm run production:preflight

      - name: Build production container
        run: docker build -f backend/Dockerfile -t aventura-backend:ci backend

      - name: Run production preflight from image
        run: >-
          docker run --rm --network host
          -e NODE_ENV=production
          -e DATABASE_URL="$DATABASE_URL"
          -e PUBLIC_REQUESTS_ENABLED=false
          aventura-backend:ci npm run production:preflight

      - name: Start production container
        run: >-
          docker run -d --name aventura-backend-ci --network host
          -e NODE_ENV=production
          -e PORT=3100
          -e DATABASE_URL="$DATABASE_URL"
          -e PUBLIC_REQUESTS_ENABLED=false
          aventura-backend:ci

      - name: Verify non-root runtime and health probes
        run: |
          test "$(docker exec aventura-backend-ci id -u)" != "0"
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:3100/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:3100/ready >/tmp/aventura-ready.json; then
              cat /tmp/aventura-ready.json
              exit 0
            fi
            sleep 1
          done
          docker logs aventura-backend-ci
          exit 1

      - name: Verify graceful SIGTERM shutdown
        run: |
          docker stop --time 12 aventura-backend-ci
          test "$(docker inspect --format='{{.State.ExitCode}}' aventura-backend-ci)" = "0"

      - name: Clean container
        if: always()
        run: docker rm --force aventura-backend-ci 2>/dev/null || true

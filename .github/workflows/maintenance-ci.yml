name: Aventura Maintenance CI

on:
  pull_request:
  push:
    branches:
      - 'refactor/**'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Delegate request data construction
        if: github.ref_name == 'refactor/contact-request-data-20260910' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('assets/js/app.js')
          app = app_path.read_text()
          anchor = '    updateSubmissionChannel();\n    var lastRequestMessage = "";\n    var isSubmitting = false;'
          replacement = '''    updateSubmissionChannel();
    var lastRequestMessage = "";
    var isSubmitting = false;
    var contactRequestData = window.AVENTURA_CONTACT_REQUEST_DATA;
    if (!contactRequestData || typeof contactRequestData.createRequestId !== "function" || typeof contactRequestData.buildMessage !== "function") {
      throw new Error("Aventura contact request data module is unavailable");
    }'''
          if app.count(anchor) != 1:
              raise SystemExit(f'expected one request-data dependency anchor, found {app.count(anchor)}')
          app = app.replace(anchor, replacement)

          start_marker = '      var selectedType = form.querySelector(\'[name="type"] option:checked\');\n'
          end_marker = '      lastRequestMessage = lines.join("\\n");\n'
          start = app.find(start_marker)
          if start == -1:
              raise SystemExit('request summary start marker not found')
          end = app.find(end_marker, start)
          if end == -1:
              raise SystemExit('request summary end marker not found')
          end += len(end_marker)
          delegated = '''      var requestId = contactRequestData.createRequestId();
      lastRequestMessage = contactRequestData.buildMessage({
        form: form,
        data: data,
        translate: translate,
        requestId: requestId,
        name: name
      });
'''
          app = app[:start] + delegated + app[end:]
          app_path.write_text(app)

          contact_path = Path('contact.html')
          contact = contact_path.read_text()
          script_anchor = '  <script src="assets/js/contact-wizard.js?v=20260910" defer></script>\n  <script src="assets/js/app.js?v=date-validation-20260830" defer></script>'
          script_replacement = '  <script src="assets/js/contact-wizard.js?v=20260910" defer></script>\n  <script src="assets/js/contact-request-data.js?v=20260910" defer></script>\n  <script src="assets/js/app.js?v=date-validation-20260830" defer></script>'
          if contact.count(script_anchor) != 1:
              raise SystemExit(f'expected one contact script anchor, found {contact.count(script_anchor)}')
          contact_path.write_text(contact.replace(script_anchor, script_replacement))
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find assets/js tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0)

      - name: Run Aventura smoke checks
        run: node tests/smoke.mjs

      - name: Run runtime state contract tests
        run: node tests/runtime-state.mjs

      - name: Run runtime integration checks
        run: node tests/runtime-integration.mjs

      - name: Run contact wizard contract checks
        run: node tests/contact-wizard-contract.mjs

      - name: Run contact request data contract checks
        run: node tests/contact-request-data-contract.mjs

      - name: Commit delegated request data
        if: github.ref_name == 'refactor/contact-request-data-20260910' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          if git diff --quiet -- assets/js/app.js contact.html; then
            echo "No migration changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/app.js contact.html
          git commit -m "Delegate contact request data construction"
          git push origin HEAD:refactor/contact-request-data-20260910

  browser:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install browser test dependency
        run: npm install --no-save playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local Aventura site
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/aventura-http.log 2>&1 &
          echo $! > /tmp/aventura-http.pid
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/contact.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/aventura-http.log
          exit 1

      - name: Run multilingual browser smoke checks
        env:
          AVENTURA_TEST_BASE_URL: http://127.0.0.1:4173
        run: node tests/browser-smoke.mjs

      - name: Run contact wizard browser checks
        env:
          AVENTURA_TEST_BASE_URL: http://127.0.0.1:4173
        run: node tests/contact-wizard-browser.mjs

      - name: Run contact request data browser checks
        env:
          AVENTURA_TEST_BASE_URL: http://127.0.0.1:4173
        run: node tests/contact-request-data-browser.mjs

      - name: Stop local site
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/aventura-http.pid ]; then
            kill "$(cat /tmp/aventura-http.pid)" 2>/dev/null || true
          fi

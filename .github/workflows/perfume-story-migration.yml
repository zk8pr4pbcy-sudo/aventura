name: Perfume story migration

on:
  push:
    branches:
      - refactor/perfume-story-runtime-20260910
    paths:
      - scripts/migrate-perfume-story-runtime.py
      - assets/js/perfume-story-runtime.js
      - tests/perfume-story-contract.mjs
      - .github/workflows/perfume-story-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/perfume-story-runtime-20260910
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply perfume story extraction
        run: python scripts/migrate-perfume-story-runtime.py
      - name: Verify JavaScript and contracts
        run: |
          node --check assets/js/app.js
          node --check assets/js/perfume-story-runtime.js
          node tests/smoke.mjs
          node tests/perfume-story-contract.mjs
      - name: Commit migrated files
        run: |
          if git diff --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/app.js assets/js/perfume-story-runtime.js tests/perfume-story-contract.mjs *.html
          git commit -m "Extract perfume story runtime from app"
          git push origin HEAD:refactor/perfume-story-runtime-20260910

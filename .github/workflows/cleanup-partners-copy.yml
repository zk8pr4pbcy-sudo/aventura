name: Aventura Partner Copy Cleanup

on:
  push:
    branches:
      - refactor/maintenance-20260909
    paths:
      - '.github/workflows/cleanup-partners-copy.yml'

permissions:
  contents: write

jobs:
  migrate-partner-copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/maintenance-20260909

      - name: Move Spanish partner copy into translations
        shell: python
        run: |
          from pathlib import Path

          translations_path = Path('assets/js/translations.js')
          translations = translations_path.read_text(encoding='utf-8')
          old_translation = '    "partners.formSideTitle": "Cuéntanos qué haces excepcionalmente bien.",'
          new_translation = '    "partners.formSideTitle": "Cuéntanos en qué destacas.",'
          if translations.count(old_translation) != 1:
              raise SystemExit(f'Expected one Spanish partner title, found {translations.count(old_translation)}. Refusing to modify.')
          translations = translations.replace(old_translation, new_translation, 1)
          translations_path.write_text(translations, encoding='utf-8')

          partners_path = Path('partners.html')
          partners = partners_path.read_text(encoding='utf-8')
          script = '    <script src="assets/js/partners-copy-fix.js?v=20260905" defer></script>\n'
          if partners.count(script) != 1:
              raise SystemExit(f'Expected one partners-copy-fix script reference, found {partners.count(script)}. Refusing to modify.')
          partners = partners.replace(script, '', 1)
          if 'partners-copy-fix.js' in partners:
              raise SystemExit('Legacy partner copy patch is still referenced.')
          partners_path.write_text(partners, encoding='utf-8')

      - name: Remove legacy patch and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm assets/js/partners-copy-fix.js
          git diff --check
          node --check assets/js/translations.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/translations.js partners.html
          git commit -m "refactor: move partner copy fix into translations"
          git push origin HEAD:refactor/maintenance-20260909

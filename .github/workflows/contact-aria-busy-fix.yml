name: Contact aria busy fix

on:
  push:
    branches:
      - refactor/contact-submission-contract-20260910

permissions:
  contents: write

jobs:
  fix:
    if: github.ref_name == 'refactor/contact-submission-contract-20260910'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set explicit idle state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('contact.html')
          text = path.read_text()
          old = '<form class="form-card" data-contact-form action="https://formsubmit.co/contact@aventuraksa.com" method="POST" novalidate data-reveal>'
          new = '<form class="form-card" data-contact-form aria-busy="false" action="https://formsubmit.co/contact@aventuraksa.com" method="POST" novalidate data-reveal>'
          if new in text:
              print('aria-busy idle state already present')
          else:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one contact form opening tag, found {count}')
              path.write_text(text.replace(old, new, 1))
          PY

      - name: Validate contact idle state
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'data-contact-form aria-busy="false"' contact.html
          node tests/contact-submission-contract.mjs
          git diff --check

      - name: Commit fix if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- contact.html; then
            echo "No aria-busy change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contact.html
          git commit -m "Set explicit idle state on contact form"
          git push origin HEAD:${GITHUB_REF_NAME}

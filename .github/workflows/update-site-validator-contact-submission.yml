name: Update site validator for contact submission module

on:
  push:
    branches:
      - refactor/contact-submission-contract-20260910

permissions:
  contents: write

jobs:
  update:
    if: github.ref_name == 'refactor/contact-submission-contract-20260910'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update validator contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/validate-site.mjs')
          text = path.read_text()

          old_sources = '''const contactWizardSource = fs.readFileSync(path.join(root, "assets/js/contact-wizard.js"), "utf8");
const contactRequestDataSource = fs.readFileSync(path.join(root, "assets/js/contact-request-data.js"), "utf8");'''
          new_sources = '''const contactWizardSource = fs.readFileSync(path.join(root, "assets/js/contact-wizard.js"), "utf8");
const contactRequestDataSource = fs.readFileSync(path.join(root, "assets/js/contact-request-data.js"), "utf8");
const contactSubmissionSource = fs.readFileSync(path.join(root, "assets/js/contact-submission.js"), "utf8");'''

          old_check = '''if (!appSource.includes('var REQUEST_EMAIL = "contact@aventuraksa.com"') || !appSource.includes('var FORM_SUBMIT_ENDPOINT = "https://formsubmit.co/ajax/contact@aventuraksa.com"') || !contactSource.includes('action="https://formsubmit.co/contact@aventuraksa.com"') || !contactSource.includes('method="POST"') || !/name="submissionChannel" value="email" checked[\\s\\S]*name="submissionChannel" value="whatsapp"/.test(contactSource) || !contactBlock.includes('var submissionChannel = String(data.get("submissionChannel") || "email")') || !contactBlock.includes('sendRequestWithFormSubmit(submissionData)') || contactBlock.includes('"mailto:" + REQUEST_EMAIL')) {
  fail("contact", "booking requests must submit automatically to contact@aventuraksa.com with WhatsApp as the second option");
}'''
          new_check = '''if (!contactSubmissionSource.includes('var FORM_SUBMIT_ENDPOINT = "https://formsubmit.co/ajax/contact@aventuraksa.com"') || !contactSubmissionSource.includes('var WHATSAPP_NUMBER = "966555884854"') || !contactSubmissionSource.includes('window.AVENTURA_CONTACT_SUBMISSION = Object.freeze({') || !contactSubmissionSource.includes('sendEmail: sendEmail') || !contactSubmissionSource.includes('buildWhatsAppUrl: buildWhatsAppUrl') || !contactSource.includes('assets/js/contact-submission.js?v=20260910') || !(contactSource.indexOf('assets/js/contact-submission.js?v=20260910') < contactSource.indexOf('assets/js/app.js')) || !contactSource.includes('action="https://formsubmit.co/contact@aventuraksa.com"') || !contactSource.includes('method="POST"') || !/name="submissionChannel" value="email" checked[\\s\\S]*name="submissionChannel" value="whatsapp"/.test(contactSource) || !contactBlock.includes('var submissionChannel = String(data.get("submissionChannel") || "email")') || !contactBlock.includes('submissionTransport.sendEmail(submissionData)') || !contactBlock.includes('submissionTransport.buildWhatsAppUrl(lastRequestMessage)') || contactBlock.includes('sendRequestWithFormSubmit(') || appSource.includes('var FORM_SUBMIT_ENDPOINT = "https://formsubmit.co/ajax/contact@aventuraksa.com"')) {
  fail("contact", "booking requests must use the dedicated contact submission transport with FormSubmit email first and WhatsApp second");
}'''

          if new_sources in text and new_check in text:
              print('Validator already updated; no changes needed.')
          else:
              if text.count(old_sources) != 1:
                  raise SystemExit(f'Expected one contact source block, found {text.count(old_sources)}')
              if text.count(old_check) != 1:
                  raise SystemExit(f'Expected one legacy contact validation block, found {text.count(old_check)}')
              text = text.replace(old_sources, new_sources, 1)
              text = text.replace(old_check, new_check, 1)
              path.write_text(text)
          PY

      - name: Validate updated site quality contract
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/validate-site.mjs
          node scripts/validate-site.mjs
          node tests/contact-submission-contract.mjs
          git diff --check

      - name: Commit validator update if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/validate-site.mjs; then
            echo "No validator changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate-site.mjs
          git commit -m "Update site validator for contact submission transport"
          git push origin HEAD:${GITHUB_REF_NAME}

# retrigger after workflow creation so the branch push executes this workflow
